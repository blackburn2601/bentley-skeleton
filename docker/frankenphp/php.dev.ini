; Development overrides, layered on top of app.ini in the `dev` image stage.

; The production image sets validate_timestamps=0, which is correct there (the code cannot
; change) and completely wrong here: with the source bind-mounted, edits would be invisible
; until the container restarted.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.preload =
opcache.jit = disable

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 512M
max_execution_time = 0

; Xdebug is installed but idle unless XDEBUG_MODE says otherwise — it roughly halves
; throughput, and most of the time you are not debugging. Start with:
;   XDEBUG_MODE=debug docker compose up -d app
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
xdebug.discover_client_host = false
