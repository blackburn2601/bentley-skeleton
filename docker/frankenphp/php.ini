; Production PHP settings. compose.yaml layers a dev override on top of this.

expose_php = Off
memory_limit = 256M
max_execution_time = 30

; Uploads are not part of the skeleton's API surface; raise deliberately if that changes.
post_max_size = 2M
upload_max_filesize = 2M

; Errors go to the log, never to the client — an error body is an information leak, and the
; problem+json listener owns the client-facing response anyway (ADR-0007).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload = /app/config/preload.php
opcache.preload_user = app
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Sessions are not used — authentication is cookie-borne JWT (ADR-0002) — but if something
; starts one, it must not be readable by JavaScript.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict

date.timezone = UTC
