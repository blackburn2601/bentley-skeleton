<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>bentley</title>
  <!--
    The tab mark: a shield, for an application whose subject is access control.

    Deliberately a flat silhouette with one tick and no filters or masks. A favicon is read at
    16x16, where gradients and blurs turn to mud; the previous mark stacked fifteen blurred
    ellipses behind a mask and arrived as a smudge at tab size.

    The fill is the sRGB equivalent of the primary token in src/style.css,
    oklch(0.488 0.199 264.376). It is hard-coded rather than referencing that token: this file
    is a static asset served outside the app's stylesheet, and oklch() is not resolved
    reliably by favicon renderers.
  -->
  <path
    fill="#2352ce"
    d="M16 2.5 5.5 6.8v9.5c0 6.6 4.4 11.6 10.5 13.2 6.1-1.6 10.5-6.6 10.5-13.2V6.8L16 2.5Z"
  />
  <path
    fill="none"
    stroke="#fff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="m11 16 3.6 3.6L21.5 13"
  />
</svg>
