# Development stack. `make up`.
#
# The app container is built from the same Dockerfile as production (ADR-0004) and then has
# the source bind-mounted over it, so what you run locally differs from production in
# configuration only.

name: bentley

services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
      target: dev
      args:
        WITH_OTEL: ${WITH_OTEL:-0}
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      SERVER_NAME: :80
      DATABASE_URL: postgresql://bentley:bentley@db:5432/bentley?serverVersion=18&charset=utf8
      REDIS_URL: redis://redis:6379
      # Xdebug is opt-in: it costs roughly 2x on every request, and most of the time you are
      # not debugging. `XDEBUG_MODE=debug docker compose up -d app` when you are.
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      # Source over the image, so edits are live. `vendor` is NOT mounted: it is built in the
      # image for the container's own platform, and mounting a host vendor/ over it is how
      # you get architecture-mismatch errors that look like PHP bugs.
      - ./backend:/app:cached
      - /app/vendor
      - /app/var
      # The generated inventories live outside backend/, and the generators resolve them as
      # dirname(kernel.project_dir)/docs — which is /docs when the project dir is /app. Mounted
      # so the tests that check a generator against the files it describes can run in the
      # container with everything else. `make docs` still writes from the host.
      - ./docs:/docs:cached
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health/live, not /health/ready. Readiness includes a migrations probe, so on a fresh
      # database the container can never become healthy until migrations run — and `docker
      # compose up --wait` blocks until it is healthy, so the step that would run them never
      # starts. That deadlock is invisible locally, where the database volume already has
      # them, and it is what CI hit on the first clean run.
      #
      # Liveness is the right question for a container healthcheck anyway: "is this process
      # serving?". Readiness is a deployment gate — `make migrate` then `curl /health/ready`.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:80/health/live') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bentley
      POSTGRES_USER: bentley
      POSTGRES_PASSWORD: bentley
      # Deterministic collation, so ORDER BY behaves the same here as in CI and production.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu"
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql, NOT at .../data:
      # the image now keeps its data in a major-version subdirectory so that
      # `pg_upgrade --link` does not have to cross a mount boundary. Mounting the
      # old path makes the container exit on startup.
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bentley -d bentley"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    image: node:26-alpine
    working_dir: /spa
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite proxies /api and /health to the app container; see frontend/vite.config.ts.
      VITE_API_PROXY: http://app:80
    volumes:
      - ./frontend:/spa:cached
      - spa_modules:/spa/node_modules
    ports:
      - "${SPA_PORT:-5173}:5173"
    depends_on:
      - app

volumes:
  db_data:
  redis_data:
  spa_modules:
