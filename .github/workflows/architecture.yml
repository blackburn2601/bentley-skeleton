name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A separate workflow from ci-backend on purpose: a layering violation should report AS a
# layering violation in the checks list, not as "some backend job failed". The distinction
# matters when someone is deciding whether their change is safe to merge.
jobs:
  contract:
    name: architecture contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-8.5-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-8.5-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --no-scripts

      # backend/.env is gitignored and no longer committed (ADR-0028). Generate it from the
      # committed backend/.env.example template with fresh dev secrets before cache:warmup
      # boots the kernel.
      - name: Generate backend/.env from the template
        run: ./bin/generate-env

      # PHPStan's Symfony extension resolves service ids against the compiled dev container.
      # Nothing else in this job builds it, and without it PHPStan aborts before analysing a
      # single file. Warming needs no database — it only compiles the container.
      - name: Warm the dev container
        working-directory: backend
        run: php bin/console cache:warmup --env=dev
        env:
          APP_ENV: dev

      - name: Layering contract
        working-directory: backend
        run: php vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress

      - name: Bounded-context contract
        working-directory: backend
        run: php vendor/bin/deptrac analyse --config-file=deptrac-context.yaml --no-progress

      - name: Size and complexity limits
        run: ./bin/phpmd-check

      - name: Architecture tests
        working-directory: backend
        run: php vendor/bin/phpunit --testsuite=architecture
        env:
          APP_ENV: test

      # The check that checks the checks. Plants a deliberate violation of every rule and
      # asserts each one fires, then asserts a conforming slice produces nothing at all.
      # Without this, a mistyped collector or a renamed directory turns enforcement into a
      # no-op that still reports success.
      - name: Prove the rules can fail
        run: ./bin/strictness-proof
