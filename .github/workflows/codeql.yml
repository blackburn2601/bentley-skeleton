name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read
  # CodeQL uploads findings, and its actions analysis reads workflow-run metadata to attach
  # them to the run. Without these two it analyses everything successfully and then fails on
  # the upload with "Resource not accessible by integration".
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # This repository is public, so CodeQL works here. Projects seeded from it usually are not:
  # code scanning needs GitHub Advanced Security on a private repository, and without it the
  # analysis runs to completion and then fails on the upload with "Code scanning is not
  # enabled for this repository". That is a red check nobody can fix from inside the project —
  # in the first project seeded from this repo it failed five times and was then switched off
  # by hand, which is how a security workflow quietly leaves a codebase.
  #
  # So the workflow asks first and skips itself where it cannot work, rather than being
  # disabled. If Advanced Security is later enabled on such a project, this starts working
  # again on its own with nothing to remember.
  check-visibility:
    name: check repo visibility
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          VISIBILITY=$(gh api repos/${{ github.repository }} --jq '.private')
          if [ "$VISIBILITY" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Private repo without Advanced Security — skipping CodeQL"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  analyse:
    name: analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    needs: check-visibility
    if: needs.check-visibility.outputs.skip != 'true'

    permissions:
      contents: read
      # Required to upload results to the Security tab.
      security-events: write
      # Required by the `actions` language: it reads workflow-run metadata to attach findings
      # to the run, and without this it analyses everything and then fails on upload with
      # "Resource not accessible by integration". A job-level permissions block REPLACES the
      # workflow-level one, so setting it at the top of the file has no effect here.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # PHP has no CodeQL analyser; Semgrep covers the backend in security.yml.
        # `actions` analyses the workflows themselves — script injection through untrusted
        # inputs is a real and easily missed class of bug in CI.
        language: ['javascript-typescript', 'actions']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
