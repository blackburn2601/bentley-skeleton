name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The real stack, built from the real Dockerfile. An e2e suite against a mocked backend
      # tests the mock.
      # The container runs as uid 1000 and the checkout belongs to the runner's own user, so
      # the app cannot write into the bind-mounted source — lexik:jwt:generate-keypair failed
      # with "Failed to create /app/config/jwt: Permission denied". Local Docker Desktop hides
      # this by mapping ownership; a Linux host whose user is not uid 1000 hits it too.
      - name: Let the container write to the mounted source
        run: |
          mkdir -p backend/config/jwt backend/var
          sudo chown -R 1000:1000 backend/config backend/var

      - name: Start the stack
        run: |
          cp docker/secrets/.gitkeep /dev/null 2>/dev/null || true
          docker compose up -d --build --wait
        env:
          COMPOSE_DOCKER_CLI_BUILD: '1'
          DOCKER_BUILDKIT: '1'

      - name: Prepare the database
        run: |
          docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          docker compose exec -T app php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
          docker compose exec -T app php bin/console app:acl:sync-permissions
          docker compose exec -T app php bin/console doctrine:fixtures:load --no-interaction

      # Now that migrations are applied, readiness must actually pass. The container
      # healthcheck only proves the process is serving; this is the assertion that every
      # dependency it needs is reachable.
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::/health/ready never came up"
          docker compose logs --tail=50 app
          exit 1

      - name: Install Playwright
        working-directory: frontend
        run: |
          # compose mounts a named volume at /spa/node_modules inside the bind-mounted
          # ./frontend, and Docker creates that mountpoint on the host as root. The runner
          # then cannot write into frontend/node_modules and `npm ci` dies with EACCES.
          # Docker Desktop remaps ownership, so this only appears on Linux.
          sudo rm -rf node_modules
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: frontend
        run: npm run e2e
        env:
          # The API and the SPA are separate origins in the harness; the sign-in tests need the
          # SPA, because __Host- cookies only work when both are reached through one origin.
          E2E_BASE_URL: http://localhost:8080
          E2E_SPA_URL: http://localhost:5173

      # Traces are what make a CI-only failure diagnosable. Without them the only tool is
      # re-running and hoping.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Application logs
        if: failure()
        run: docker compose logs --no-color --tail=400

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
