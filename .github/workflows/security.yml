name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly. A dependency that was clean yesterday can be a known CVE today, and nobody
    # opens a PR to tell you.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --no-scripts

      # roave/security-advisories already blocks a known-vulnerable package at install time.
      # This catches an advisory published AFTER the lockfile was written, which is the case
      # the conflict rules cannot cover.
      - name: composer audit
        working-directory: backend
        run: composer audit --no-interaction

      - name: npm audit
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret that was committed and then removed is still a leaked
          # secret, and it is still in the objects.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-security:
    name: semgrep
    runs-on: ubuntu-latest
    # PHP has no CodeQL analyser, so this is the only static security analysis the backend
    # gets. It is not optional.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/php
            p/javascript
            p/owasp-top-ten
            p/secrets

  filesystem:
    name: trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Entries in .trivyignore MUST carry an expiry date — an ignore with no end is a
          # vulnerability someone decided to stop looking at.
          trivyignores: .trivyignore

  image:
    name: trivy image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # backend/.env is gitignored (ADR-0028). The production image's Dockerfile runs
      # `cache:warmup --env=prod` at build time, which boots the kernel and needs a .env to
      # exist — so the build context must contain one. Generate it from .env.example with
      # fresh dev secrets before the image build; the COPY backend/ /app/ step bakes it in,
      # exactly as the committed .env did before ADR-0028.
      - name: Generate backend/.env from the template
        run: ./bin/generate-env

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/frankenphp/Dockerfile
          target: runtime
          push: false
          load: true
          tags: bentley-skeleton:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanning the IMAGE, not just the source: most of what ships is the base image and its
      # system packages, and none of that appears in a filesystem scan of the repository.
      - name: Trivy
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: image
          image-ref: bentley-skeleton:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # The image job did not read this file, so the expiry-dated acceptances the
          # filesystem job honoured were invisible here — the one scan that sees the base
          # image was the one that could not accept anything.
          trivyignores: .trivyignore

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: bentley-skeleton:ci
          format: spdx-json
          artifact-name: sbom.spdx.json
