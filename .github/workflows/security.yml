name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly. A dependency that was clean yesterday can be a known CVE today, and nobody
    # opens a PR to tell you.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --no-scripts

      # roave/security-advisories already blocks a known-vulnerable package at install time.
      # This catches an advisory published AFTER the lockfile was written, which is the case
      # the conflict rules cannot cover.
      - name: composer audit
        working-directory: backend
        run: composer audit --no-interaction

      - name: npm audit
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # On a pull_request event the action asks the API which commits the PR contains, and the
    # workflow-level `contents: read` does not cover that endpoint — the job died with
    # "Resource not accessible by integration" (403 on /pulls/{n}/commits) on every PR while
    # passing on push and schedule, which is the worst shape a secret scan can fail in: green
    # where nothing is proposed, red where it is.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret that was committed and then removed is still a leaked
          # secret, and it is still in the objects.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read, not write: the action's other use for the token is annotating the PR with a
          # comment per finding, and posting one would require `pull-requests: write` — a
          # token that can write to the PR, granted for the sake of a nicer message. The job's
          # exit code is the signal, so comments are off and the permission stays read-only.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  static-security:
    name: semgrep
    runs-on: ubuntu-latest
    # PHP has no CodeQL analyser, so this is the only static security analysis the backend
    # gets. It is not optional.
    #
    # It ran green and scanned nothing from the day it was written until 2026-09-11, here and
    # in every project seeded from this repository. `semgrep/semgrep-action@v1` is archived
    # upstream and ships semgrep 1.36.0 (August 2023), which predates the registry's move to
    # the LOW/MEDIUM/HIGH severity taxonomy — so every run died with
    # `ValueError: invalid rule severity value: MEDIUM` the moment it loaded a current rule,
    # and the action swallowed the non-zero exit and reported success.
    #
    # Hence the shape below: the official image, invoked directly, so the exit code is the
    # scan's own. A crash fails the job now, which is the property that was missing.
    container:
      # Pinned by digest, like every action here is pinned by SHA — the point of pinning is
      # that a supply-chain change is a visible diff rather than a silent one. Dependabot
      # bumps this along with the actions.
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: semgrep
        # `scan`, not `ci`: `semgrep ci` scans the diff when it can, and a pre-existing
        # weakness that a pull request starts depending on is exactly the finding a diff-aware
        # scan reports once and then never again. A project this size scans fully in seconds.
        #
        # `--error` turns findings into a non-zero exit. Without it semgrep prints them and
        # exits 0 — which is half of how this job came to report success while scanning
        # nothing.
        run: >-
          semgrep scan
          --config=p/php
          --config=p/javascript
          --config=p/owasp-top-ten
          --config=p/secrets
          --error
          --metrics=off

  filesystem:
    name: trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Entries in .trivyignore MUST carry an expiry date — an ignore with no end is a
          # vulnerability someone decided to stop looking at.
          trivyignores: .trivyignore

  image:
    name: trivy image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # backend/.env is gitignored (ADR-0028). The production image's Dockerfile runs
      # `cache:warmup --env=prod` at build time, which boots the kernel and needs a .env to
      # exist — so the build context must contain one. Generate it from .env.example with
      # fresh dev secrets before the image build; the COPY backend/ /app/ step bakes it in,
      # exactly as the committed .env did before ADR-0028.
      - name: Generate backend/.env from the template
        run: ./bin/generate-env

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Today's date, passed into the build below as SECURITY_REFRESH.
      #
      # Without it the layers that fetch fixes — `apt-get upgrade`, and the `go get @latest`
      # that rebuilds the frankenphp binary — are served from the gha cache and re-resolve
      # nothing, so the one job whose purpose is "what would we ship today" would keep
      # scanning a build from whenever the cache was warmed. A date rather than the run id:
      # PRs pushed on the same day still share the cache.
      - name: Date stamp for the security refresh
        id: refresh
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build the production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/frankenphp/Dockerfile
          target: runtime
          push: false
          load: true
          tags: bentley-skeleton:ci
          build-args: |
            SECURITY_REFRESH=${{ steps.refresh.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanning the IMAGE, not just the source: most of what ships is the base image and its
      # system packages, and none of that appears in a filesystem scan of the repository.
      - name: Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: image
          image-ref: bentley-skeleton:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # The image job did not read this file, so the expiry-dated acceptances the
          # filesystem job honoured were invisible here — the one scan that sees the base
          # image was the one that could not accept anything.
          trivyignores: .trivyignore

      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: bentley-skeleton:ci
          format: spdx-json
          artifact-name: sbom.spdx.json
