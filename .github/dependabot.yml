version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Grouped so routine patches arrive as ONE reviewable PR. Twenty separate bumps a week
      # do not get reviewed, they get rubber-stamped — which is worse than not updating.
      backend-minor-patch:
        update-types: [minor, patch]
    # An entry here must cite the ADR it enforces. Anything else is a dependency somebody
    # found inconvenient, which is how a project ends up pinned to something nobody can
    # explain. Delete the entry when the ADR is superseded, not before.
    ignore:
      # ADR-0005: this repository seeds other projects, so it tracks the LTS. 7.4 has security
      # fixes to November 2029; 8.1 is a standard release with roughly fourteen months. The
      # first push produced five separate PRs moving individual Symfony components to 8.1,
      # which would fragment the version set one package at a time — exactly the drift the
      # ADR exists to prevent. Minor and patch updates within 7.4 still arrive, grouped.
      - dependency-name: 'symfony/*'
        update-types: ['version-update:semver-major']
    labels: [dependencies, no-adr-needed]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ADR-0018: TypeScript 7 is the Go rewrite and no longer exports `typescript/lib/tsc`,
      # which `vue-tsc` resolves at startup — so `make front-lint` dies with
      # ERR_PACKAGE_PATH_NOT_EXPORTED and the SPA has no type checking at all. Remove this the
      # day vue-tsc supports it; the ADR says what to test.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    labels: [dependencies, no-adr-needed]

  - package-ecosystem: docker
    directory: /docker/frankenphp
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, no-adr-needed]

  # Actions are pinned by SHA, which is what makes a supply-chain attack on an action visible
  # rather than automatic — and is exactly why they need an automated bump, or they never move.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, no-adr-needed]
