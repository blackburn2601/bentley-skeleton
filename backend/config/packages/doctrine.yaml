doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '18'
        charset: utf8
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            # UUIDv7 primary keys everywhere (ADR-0013).
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
            # Case-insensitive email, enforced by the database rather than by remembering
            # to lowercase in every query.
            citext: App\Shared\Infrastructure\Doctrine\CitextType

        # DBAL does not know citext, and without this mapping it reports a schema difference
        # on every diff for a column that has not changed.
        mapping_types:
            citext: citext

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        # UUIDv7 PKs are generated by the application, never by the database (ADR-0013),
        # so no identity/sequence preference is declared here.
        auto_mapping: false
        # One mapping per bounded context. Entities live in <Context>/Domain/; anything in
        # there without an ORM attribute is simply ignored by the attribute driver.
        # Adding a context means adding a mapping here AND a deptrac layer — see
        # docs/cookbook/add-entity-with-acl.md.
        mappings:
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Account/Domain'
                prefix: 'App\Account\Domain'
                alias: Account
            Acl:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Acl/Domain'
                prefix: 'App\Acl\Domain'
                alias: Acl
            Audit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Audit/Domain'
                prefix: 'App\Audit\Domain'
                alias: Audit
            Platform:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Platform/Domain'
                prefix: 'App\Platform\Domain'
                alias: Platform

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
