nelmio_cors:
    defaults:
        origin_regex: true
        # An explicit allow-list, never '*'.
        #
        # With allow_credentials, '*' is not merely lax — browsers reject the combination
        # outright, so a wildcard here would silently break the SPA rather than loosen it.
        # CORS_ALLOW_ORIGIN is a regex anchored at both ends; an unanchored one matching
        # "example.com" would also match "example.com.evil.test".
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PATCH', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'X-CSRF-Token', 'X-Request-Id']
        expose_headers:
            # The client needs to read these to back off gracefully and to quote an id in a
            # support request. Anything not listed here is invisible to JavaScript.
            - 'X-Request-Id'
            - 'X-RateLimit-Limit'
            - 'X-RateLimit-Remaining'
            - 'X-RateLimit-Reset'
            - 'Retry-After'
        # Cookies are the credential (ADR-0002), so cross-origin requests must be allowed to
        # carry them — and the origin list above is what makes that safe.
        allow_credentials: true
        max_age: 3600

    paths:
        '^/api/':
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_credentials: true
        '^/health/':
            # Probes are made by orchestrators, not browsers, and must not depend on the SPA's
            # origin being configured correctly.
            allow_origin: ['*']
            allow_credentials: false
