monolog:
    channels: ['deprecation']

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            # JSON to stdout: the container IS the log. Nothing is written to disk, which is
            # what makes the read-only root filesystem possible (docs/OPERATIONS.md).
            main:
                type: fingers_crossed
                # Buffer everything, and emit the whole buffer when something goes wrong. The
                # debug lines leading UP to an error are what make it diagnosable; keeping them
                # only when they matter is what keeps the log affordable.
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: stream
                path: 'php://stderr'
                level: debug
                formatter: monolog.formatter.json

            # Deprecations go to their own stream at info level rather than through the
            # fingers-crossed buffer, or they only ever appear alongside an unrelated error.
            deprecation:
                type: stream
                channels: [deprecation]
                path: 'php://stderr'
                formatter: monolog.formatter.json
