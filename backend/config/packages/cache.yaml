framework:
    cache:
        # Stable namespace for cache keys, so two deployments sharing a Redis do not collide.
        prefix_seed: 'bentley/skeleton'

        # Redis for everything: the production stack runs more than one app container, and a
        # filesystem cache would give each replica its own private answers. That is merely
        # wasteful for the app cache and actively wrong for rate limiting (ADR-0008).
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            # Permission decisions, keyed by the user's acl_version (ADR-0011).
            #
            # Its own pool for two reasons: it can be cleared during an authorization incident
            # without discarding every other cached value, and its hit rate shows up separately
            # in metrics — which is the number that tells you whether the ACL is actually cheap.
            #
            # The TTL here is a backstop only. Correctness comes from the version in the key,
            # not from expiry: a stale entry is never read, because a grant change changes the
            # key. The TTL exists so that entries for users who never return get reclaimed.
            cache.acl:
                adapter: cache.adapter.redis
                default_lifetime: 300

            # Doctrine's own pools, referenced from doctrine.yaml in prod.
            doctrine.result_cache_pool:
                adapter: cache.app
            doctrine.system_cache_pool:
                adapter: cache.system

when@test:
    framework:
        cache:
            # Tests must not need Redis running, and must not leak state between cases.
            app: cache.adapter.array
            pools:
                cache.acl:
                    adapter: cache.adapter.array
