framework:
    rate_limiter:
        # Named policies, one per risk profile (ADR-0008). Named rather than inline because an
        # unnamed limit is invisible to everyone who did not write it — these appear in
        # docs/ENDPOINTS.md and are referenced by #[RateLimit] on the endpoints.
        #
        # All Redis-backed: the production stack runs more than one app container, and a
        # per-process limiter silently multiplies every limit by the replica count.

        # Credential stuffing. Fixed window so the lockout countdown tells the truth:
        # Retry-After is the real seconds until the bucket resets, not a drip-rate estimate
        # (ADR-0030). A sliding window reported ~180 s here for a ~900 s wait, so a caller who
        # waited the advertised time was still blocked — which reads as "the limiter is broken"
        # when only the number was wrong. The cost of fixed window is a boundary burst (up to
        # ~2x limit in the second a window flips), acceptable because this limiter is the first
        # line, not the only one: account lockout, MFA and audit events defend the same path.
        # Keyed on IP *and* username by the subscriber: IP alone lets an attacker rotate
        # addresses, username alone lets them spray many accounts from one host.
        login:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        # Self-service password change. Sliding window keyed on the signed-in user: a caller
        # who just proved they know the current password can change it, but not hammer the
        # verification path that re-checks it.
        change_password:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'

        refresh:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'

        # Ordinary authenticated traffic. Token bucket, not sliding window: real clients are
        # bursty — a page load fires a dozen requests at once — and a window would reject that
        # while allowing a steady drip that is far more expensive overall.
        api_user:
            policy: 'token_bucket'
            limit: 60
            rate: { interval: '1 minute', amount: 120 }

        # Anonymous traffic is keyed on IP, which NAT makes coarse, so this is deliberately
        # generous. It exists to stop scraping, not to police individuals.
        api_anon:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'

        admin_write:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # TOTP second-factor verification (ADR-0026). Keyed on IP + payload, like login, so a
        # brute force of one account's 6-digit space is bounded per address rather than per
        # account; 5 attempts per 15 minutes gives a real user room to misread while keeping an
        # online guess rate uneconomic. Fixed window for the same reason as login: the lockout
        # countdown must be accurate (ADR-0030).
        totp_verify:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        recovery_verify:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        # MFA enrollment is an authenticated self-service action; keyed on IP to keep a
        # compromised session from grinding the confirm path.
        mfa_enrol:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'

        mfa_confirm:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'

        mfa_disable:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'

        # Administrator MFA controls, keyed on IP + payload (the target user id).
        mfa_admin_set:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'

        mfa_admin_reset:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            # Tests assert limits explicitly; they must not inherit state between cases, and
            # must not need Redis. The storage is swapped, not the policies.
            login: { policy: 'fixed_window', limit: 5, interval: '15 minutes' }
