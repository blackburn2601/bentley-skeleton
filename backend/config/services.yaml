# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Entry point for this application's own service wiring.
# Files in packages/ configure third-party bundles.

parameters:
    # Project identity. `make new-project NAME=...` rewrites these.
    app.name: 'bentley-skeleton'
    app.cookie_prefix: 'bentley'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # The docs generators and makers resolve repository paths from here.
            string $projectDir: '%kernel.project_dir%'

    # Every class under src/ is a service candidate, EXCEPT the Domain layer.
    # Domain holds entities, value objects, enums and repository interfaces — none of
    # which are services, and registering them would let a service be injected with an
    # entity, which INV-04 forbids. See docs/INVARIANTS.md.
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Domain/'
            - '../src/Shared/Domain/'
            - '../src/Kernel.php'
            # Code generators depend on symfony/maker-bundle, which is require-dev. They are
            # registered below for dev and test only, so a production container never tries
            # to instantiate a class whose parent does not exist there.
            - '../src/Maker/'

    # DoctrineMigrationsBundle registers its factory under a service id, not the class name,
    # so the readiness probe cannot autowire it without this alias.
    Doctrine\Migrations\DependencyFactory: '@doctrine.migrations.dependency_factory'

    # --- Stateless domain policies ---------------------------------------------------
    # INV-04 excludes Domain from the container so that an ENTITY can never be autowired into
    # a service. A policy object is not an entity: it has no identity, no state and no
    # dependencies, and it belongs in Domain because it encodes a domain rule that the
    # registration and password-reset flows must apply identically.
    #
    # Registered by name rather than by relaxing the exclusion, so each exception is a
    # deliberate, reviewable line rather than a widened glob.
    App\Account\Domain\PasswordPolicy: ~

    # --- Ports to adapters ----------------------------------------------------------
    # Only real port boundaries appear here (INV-12): a second implementation exists, or the
    # implementation belongs to a different context or to infrastructure we want to swap in
    # tests. There is deliberately no interface-per-service ceremony.
    App\Shared\Domain\Clock: '@App\Shared\Infrastructure\SystemClock'
    App\Shared\Domain\SecretGenerator: '@App\Shared\Infrastructure\RandomSecretGenerator'
    App\Shared\Application\AclVersionProvider: '@App\Account\Infrastructure\UserAclVersionProvider'

    App\Account\Domain\UserRepository: '@App\Account\Infrastructure\Repository\DoctrineUserRepository'
    App\Account\Domain\RefreshTokenRepository: '@App\Account\Infrastructure\Repository\DoctrineRefreshTokenRepository'
    App\Account\Application\PasswordHasher: '@App\Account\Infrastructure\Security\SymfonyPasswordHasher'
    App\Account\Application\AccessTokenIssuer: '@App\Account\Infrastructure\Security\JwtAccessTokenIssuer'
    App\Account\Application\BreachedPasswordChecker: '@App\Account\Infrastructure\Http\HibpBreachedPasswordChecker'

    App\Audit\Domain\SecurityEventRepository: '@App\Audit\Infrastructure\Repository\DoctrineSecurityEventRepository'
    App\Audit\Application\Service\RequestContextProvider: '@App\Audit\Infrastructure\Http\HttpRequestContextProvider'
    App\Acl\Domain\AclEntryRepository: '@App\Acl\Infrastructure\Repository\DoctrineAclEntryRepository'
    App\Acl\Domain\RoleRepository: '@App\Acl\Infrastructure\Repository\DoctrineRoleRepository'
    App\Acl\Domain\PermissionRepository: '@App\Acl\Infrastructure\Repository\DoctrinePermissionRepository'
    App\Acl\Domain\SubjectRepository: '@App\Acl\Infrastructure\Repository\DoctrineSubjectRepository'
    App\Acl\Domain\UserGroupRepository: '@App\Acl\Infrastructure\Repository\DoctrineUserGroupRepository'

    # The ACL's SQL-level collection filter, behind the port its Application-layer callers
    # must reach it through (INV-01).
    App\Acl\Application\AclQueryFilter: '@App\Acl\Infrastructure\AclCriteriaBuilder'

    # The ACL cache gets its own pool so it can be cleared without touching anything else,
    # and so its hit rate is visible separately in metrics.
    App\Acl\Application\AclCache:
        arguments:
            $aclCache: '@cache.acl'
            $ttlSeconds: 300

    # --- Configuration bound to services ---------------------------------------------
    # Token lifetimes come from env so they can differ per environment without a code
    # change, and are bound in ONE place: an access-token TTL that disagreed with its
    # cookie's Max-Age would log people out unpredictably.
    App\Account\Infrastructure\Security\JwtAccessTokenIssuer:
        arguments:
            $ttlSeconds: '%env(int:ACCESS_TOKEN_TTL)%'

    App\Account\Application\Service\StartSessionService:
        arguments:
            $ttlSeconds: '%env(int:REFRESH_TOKEN_TTL)%'

    App\Account\Application\Service\RotateRefreshTokenService:
        arguments:
            $ttlSeconds: '%env(int:REFRESH_TOKEN_TTL)%'

    App\Account\Application\Service\SignInService:
        arguments:
            $refreshTtlSeconds: '%env(int:REFRESH_TOKEN_TTL)%'

    App\Account\Application\Service\RefreshSessionService:
        arguments:
            $refreshTtlSeconds: '%env(int:REFRESH_TOKEN_TTL)%'

    App\Account\Infrastructure\Http\HibpBreachedPasswordChecker:
        arguments:
            $enabled: '%env(bool:PASSWORD_HIBP_CHECK)%'

    App\Api\Security\AuthCookies:
        arguments:
            $sameSite: '%env(COOKIE_SAMESITE)%'

    App\Api\Listener\SecurityHeadersSubscriber:
        arguments:
            # Off in dev: there is no TLS on http://localhost, and a browser that receives
            # HSTS there pins the whole domain to https and remembers it long after you have
            # stopped wanting it.
            $hstsEnabled: '%env(bool:SECURITY_HSTS_ENABLED)%'

    App\Api\Listener\CsrfDoubleSubmitSubscriber:
        arguments:
            $enabled: '%env(bool:SECURITY_CSRF_ENABLED)%'

    App\Api\Listener\RateLimitSubscriber:
        arguments:
            $enabled: '%env(bool:RATE_LIMIT_ENABLED)%'


    App\Api\Platform\MetricsController:
        arguments:
            # Comma-separated CIDRs allowed to scrape. Empty means nobody, which is the right
            # default: an accidentally public /metrics is reconnaissance for free.
            $allowedCidrs: '%env(METRICS_ALLOWED_CIDRS)%'

    # Entity change history (ADR-0017). auditor-bundle cannot install on Symfony 7.4, so the
    # core library is wired here — a factory producing the configured Auditor, and the
    # subscribers that record changes.
    App\Audit\Infrastructure\Auditor\AuditorFactory:
        arguments:
            $auditedEntities: '%app.audited_entities%'
            $enabled: '%env(bool:AUDIT_ENTITY_HISTORY)%'

    # The DBAL middleware that actually writes the audit rows.
    #
    # The auditor's Doctrine subscriber collects changes on onFlush, then hands them to the
    # CONNECTION DRIVER to flush once the surrounding transaction commits — so the audit row
    # and the change it describes land together or not at all. If the driver is not wrapped by
    # this middleware, the subscriber quietly does nothing: the tables exist, the configuration
    # verifies, and no history is ever written. auditor-bundle registers this; without the
    # bundle (ADR-0017) it is registered here.
    DH\Auditor\Provider\Doctrine\Auditing\DBAL\Middleware\AuditorMiddleware:
        tags: [{ name: doctrine.middleware }]

    DH\Auditor\Auditor:
        factory: ['@App\Audit\Infrastructure\Auditor\AuditorFactory', 'create']
        # Public so app:audit:schema-update and diagnostics can reach it directly. It is
        # infrastructure wiring rather than application code, and nothing injects it except
        # the initializer.
        public: true

    # Every outbound HTTP call goes through the SSRF guard, by decorating the default client
    # rather than by asking callers to opt in. A guard you have to remember to use is a guard
    # that will be forgotten exactly once.
    App\Platform\Infrastructure\Http\SsrfGuardedHttpClient:
        decorates: 'http_client'
        arguments:
            $inner: '@.inner'
            $allowedHosts: '%env(csv:HTTP_EGRESS_ALLOWLIST)%'

    # Every rate-limit policy, by name. The limiter factories are registered under service
    # ids rather than class names, so they cannot be autowired by type. Listing them here
    # makes the set greppable — "what limits exist?" is answered by this block plus
    # rate_limiter.yaml, without reading a subscriber.
    App\Api\Security\RateLimiterRegistry:
        arguments:
            $factories:
                login: '@limiter.login'
                change_password: '@limiter.change_password'
                refresh: '@limiter.refresh'
                api_user: '@limiter.api_user'
                api_anon: '@limiter.api_anon'
                admin_write: '@limiter.admin_write'

    App\Api\Security\CookieTokenAuthenticator:
        arguments:
            # Off by default. With a Bearer header accepted, any endpoint reachable by a
            # browser becomes reachable by a script holding a token, and the CSRF protection
            # the cookie scheme provides no longer applies. Turn it on only for machine
            # clients that genuinely cannot hold cookies.
            $allowBearerHeader: '%env(bool:AUTH_ALLOW_BEARER_HEADER)%'

when@dev: &dev_services
    services:
        _defaults:
            autowire: true
            autoconfigure: true
            bind:
                string $projectDir: '%kernel.project_dir%'

        App\Fixtures\:
            resource: '../fixtures/'

        App\Maker\:
            resource: '../src/Maker/'
            exclude: '../src/Maker/skeleton/'

        # Test scaffolding, registered in dev as well purely so static analysis can see it:
        # PHPStan resolves container lookups against the DEV container dump, and a service
        # defined only under when@test reads to it as a typo. tests/ is autoloaded in dev but
        # not under `composer install --no-dev`, so this never reaches a production container.
        App\Tests\Support\DocumentGenerators:
            public: true
            arguments:
                - !tagged_iterator App\Shared\Application\Docs\DocumentGenerator

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
            bind:
                string $projectDir: '%kernel.project_dir%'

        App\Fixtures\:
            resource: '../fixtures/'

        App\Maker\:
            resource: '../src/Maker/'
            exclude: '../src/Maker/skeleton/'

        # Services the integration tests resolve from the container directly.
        #
        # Symfony REMOVES a private service that nothing injects, so a class with no consumers
        # yet — AclCriteriaBuilder, until the first collection endpoint uses it — is simply not
        # there to fetch. Making them public in the test environment only is the narrow fix;
        # the alternative is writing a fake consumer, which is worse.
        App\Acl\Infrastructure\AclCriteriaBuilder: { public: true }
        App\Acl\Application\PermissionResolver: { public: true }
        App\Acl\Application\AclFacade: { public: true }
        App\Account\Application\AccountFacade: { public: true }
        App\Shared\Domain\Clock: '@App\Shared\Infrastructure\SystemClock'
        App\Shared\Infrastructure\SystemClock: { public: true }
        App\Acl\Application\Service\EnsureBaselineRolesService: { public: true }
        App\Acl\Application\Service\SyncPermissionsService: { public: true }
        App\Shared\Application\AclVersionProvider: '@App\Account\Infrastructure\UserAclVersionProvider'
        App\Account\Infrastructure\UserAclVersionProvider: { public: true }
        Symfony\Component\PasswordHasher\Hasher\PasswordHasherFactoryInterface: '@security.password_hasher_factory'

        # The same tagged iterator app:docs:generate receives. Fetching the generators
        # individually would test four classes; fetching the collection also tests that each
        # one is actually tagged — an untagged generator never runs, and its document rots
        # while every gate stays green.
        App\Tests\Support\DocumentGenerators:
            public: true
            arguments:
                - !tagged_iterator App\Shared\Application\Docs\DocumentGenerator

