# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Entry point for this application's own service wiring.
# Files in packages/ configure third-party bundles.

parameters:
    # Project identity. `make new-project NAME=...` rewrites these.
    app.name: 'bentley-skeleton'
    app.cookie_prefix: 'bentley'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # The docs generators and makers resolve repository paths from here.
            string $projectDir: '%kernel.project_dir%'

    # Every class under src/ is a service candidate, EXCEPT the Domain layer.
    # Domain holds entities, value objects, enums and repository interfaces — none of
    # which are services, and registering them would let a service be injected with an
    # entity, which INV-04 forbids. See docs/INVARIANTS.md.
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Domain/'
            - '../src/Shared/Domain/'
            - '../src/Kernel.php'
            # Code generators depend on symfony/maker-bundle, which is require-dev. They are
            # registered below for dev and test only, so a production container never tries
            # to instantiate a class whose parent does not exist there.
            - '../src/Maker/'

    # DoctrineMigrationsBundle registers its factory under a service id, not the class name,
    # so the readiness probe cannot autowire it without this alias.
    Doctrine\Migrations\DependencyFactory: '@doctrine.migrations.dependency_factory'

    # --- Ports to adapters ----------------------------------------------------------
    # Only real port boundaries appear here (INV-12): a second implementation exists, or the
    # implementation belongs to a different context or to infrastructure we want to swap in
    # tests. There is deliberately no interface-per-service ceremony.
    App\Shared\Domain\Clock: '@App\Shared\Infrastructure\SystemClock'
    App\Shared\Domain\SecretGenerator: '@App\Shared\Infrastructure\RandomSecretGenerator'
    App\Shared\Application\AclVersionProvider: '@App\Account\Infrastructure\UserAclVersionProvider'

    App\Account\Domain\UserRepository: '@App\Account\Infrastructure\Repository\DoctrineUserRepository'
    App\Acl\Domain\AclEntryRepository: '@App\Acl\Infrastructure\Repository\DoctrineAclEntryRepository'
    App\Acl\Domain\RoleRepository: '@App\Acl\Infrastructure\Repository\DoctrineRoleRepository'
    App\Acl\Domain\PermissionRepository: '@App\Acl\Infrastructure\Repository\DoctrinePermissionRepository'
    App\Acl\Domain\SubjectRepository: '@App\Acl\Infrastructure\Repository\DoctrineSubjectRepository'

    # The ACL cache gets its own pool so it can be cleared without touching anything else,
    # and so its hit rate is visible separately in metrics.
    App\Acl\Application\AclCache:
        arguments:
            $aclCache: '@cache.acl'
            $ttlSeconds: 300

when@dev: &dev_services
    services:
        _defaults:
            autowire: true
            autoconfigure: true
            bind:
                string $projectDir: '%kernel.project_dir%'

        App\Fixtures\:
            resource: '../fixtures/'

        App\Maker\:
            resource: '../src/Maker/'
            exclude: '../src/Maker/skeleton/'

when@test: *dev_services
